services:
  shkaf-hud:
    build: .
    image: shkaf-hud:latest
    container_name: shkaf-hud
    restart: unless-stopped

    # Точный путь: ls -l /dev/serial/by-id/ на хосте
    devices:
      - "${SERIAL_DEVICE_PATH}:/dev/ttyACM0"

    volumes:
      - "${ARRAY_PATH:-/mnt/user}:/mnt/user:ro"
      - "./config:/config"

    ports:
      - "8189:8189"

    env_file:
      - .env

    environment:
      SERIAL_PORT: "/dev/ttyACM0"
